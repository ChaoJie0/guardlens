services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    # Image may be pulled via a registry mirror and re-tagged locally; never
    # block startup on Docker Hub. `docker pull qdrant/qdrant:v1.12.4` first,
    # or e.g. `docker pull docker.1ms.run/qdrant/qdrant:v1.12.4 && docker tag …`.
    pull_policy: never
    container_name: guardlens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + Web UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local
