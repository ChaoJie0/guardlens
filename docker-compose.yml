services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: guardlens-qdrant
    restart: unless-stopped
    ports:
      # Local only: this store is unauthenticated, never publish it.
      - "127.0.0.1:6333:6333"   # REST + Web UI
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local
