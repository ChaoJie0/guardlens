name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Pytest
        run: uv run pytest -q

      - name: Ingest the bundled sample (smoke test)
        run: |
          uv run python -m guardlens.ingest \
            --input data/sample/audit-sample.jsonl \
            --db data/derived/ci-sample.duckdb \
            --quarantine data/quarantine/ci-quarantine.jsonl

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Inspect the wheel contents
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile, tarfile

          bad_markers = (".venv", "data/derived", "data/raw", "fp-proxies", "__pycache__", ".log", ".pytest_cache")

          for whl in glob.glob("dist/*.whl"):
              names = zipfile.ZipFile(whl).namelist()
              print(f"{whl}: {len(names)} files")
              leaks = [n for n in names if any(m in n for m in bad_markers)]
              assert not leaks, f"unexpected files in wheel: {leaks}"

          for tar in glob.glob("dist/*.tar.gz"):
              names = tarfile.open(tar).getnames()
              print(f"{tar}: {len(names)} files")
              leaks = [n for n in names if any(m in n for m in bad_markers)]
              assert not leaks, f"unexpected files in sdist: {leaks}"
          PY
