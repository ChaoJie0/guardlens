version: 2
updates:
  # Python dependencies: routine minor/patch bumps arrive as one grouped PR;
  # major bumps are left as individual PRs because they can change runtime
  # behaviour (duckdb SQL semantics, pandas copy-on-write, LLM SDK shape).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
