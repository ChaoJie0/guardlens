[project]
name = "guardlens"
version = "0.4.0"
description = "RAG-native security analytics for autonomous agent audit logs: ingestion, metrics, cited hybrid-retrieval Q&A, guarded SQL and offline evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chaojie Tian" },
]
keywords = [
    "rag",
    "security-analytics",
    "audit-logs",
    "ai-agents",
    "retrieval",
    "observability",
    "siem",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    # local embeddings + vector stores + OpenAI-compatible LLM
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.19.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.uv]
package = true

# Uses the default PyPI index so the project resolves anywhere. If PyPI is
# slow from your network, override locally instead of editing this file:
#   export UV_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
